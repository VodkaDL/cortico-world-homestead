<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>田园烟火 · Coopanion World</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f1e9;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#294535}aside{position:fixed;inset:0 auto 0 0;width:204px;background:#183e32;color:#d2decf;padding:32px 17px}aside h1{font-size:18px;letter-spacing:4px;margin:0 0 4px 13px}aside p{font-size:10px;letter-spacing:2px;opacity:.45;margin:0 0 32px 13px}nav{display:grid;gap:7px}nav button{border:0;border-radius:7px;padding:12px 14px;text-align:left;color:#b8cbb9;background:transparent;font:13px system-ui;cursor:pointer}nav button.active{background:#35614a;color:#fff}aside footer{position:absolute;bottom:25px;font-size:10px;opacity:.45;left:30px;line-height:2}#root{margin:22px 26px 22px 230px;max-width:1280px}.preview-tag{font-size:10px;letter-spacing:1px;color:#8a957e;margin-bottom:12px}#panel{min-height:calc(100vh - 90px)}@media(max-width:760px){aside{position:static;width:100%;padding:16px}aside h1{display:inline-block;margin:0 10px 0 0}aside p{display:inline;margin:0}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap;padding:7px 11px}aside footer{display:none}#root{margin:15px}}
</style></head><body><aside><h1>田园烟火</h1><p>HOMESTEAD</p><nav id="nav"></nav><footer>COOPANION WORLD · API 6<br>本地开发预览 / 独立测试存档</footer></aside><div id="root"><div class="preview-tag">MY LITTLE HOMESTEAD / 主人的田园手册</div><div id="panel"></div></div><script type="module">
import webui from '/webui.js';
const names={overview:'◉ 田园总览',farm:'♧ 田地与天气',livestock:'♟ 动物与养殖',diary:'▧ 小院日记',kitchen:'♨ 厨房与菜谱',storage:'▤ 仓储与保鲜',market:'⌂ 赶集与公告',recipes:'＋ 添加菜谱',items:'＋ 添加物品'};let abort;
function open(id){abort?.abort();abort=new AbortController();const signal=abort.signal,root=document.querySelector('#panel');root.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));webui.panels[id].mount({root,language:'zh',signal,interval(fn,ms){const timer=setInterval(fn,ms);signal.addEventListener('abort',()=>clearInterval(timer),{once:true});},invoke:async(method,args)=>{const response=await fetch('/invoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({panel:id,method,args})});const res=await response.json();if(!response.ok)throw new Error(res.error);return res;}});history.replaceState(null,'',`#${id}`);}
for(const [id,name]of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.panel=id;b.onclick=()=>open(id);document.querySelector('#nav').append(b);}open(Object.hasOwn(names,location.hash.slice(1))?location.hash.slice(1):'overview');
</script></body></html>
